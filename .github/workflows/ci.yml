name: tests

on:
  push:
  pull_request:

jobs:
  tests:
    runs-on: ubuntu-latest
    env:
      LLM_REASONING_EFFORT: none     # as when the runs were recorded
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install uv, with Python 3.12
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          python-version: "3.12"

      - name: Install the packages the lessons use
        run: uv sync --frozen

      - name: The data files agree with each other, and no run holds a sealed email
        run: uv run python scripts/check_data.py

      - name: Every lesson's solution passes its tests
        run: uv run python scripts/lesson.py all

      - name: The helpdesk and scorecard packages pass their tests
        run: uv run pytest -q helpdesk/tests scorecard/tests
